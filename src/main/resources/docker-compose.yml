# Use root/example as user/password credentials
version: '3.1'

services:

  db:
    container_name: mariadb
    image: mariadb:10.10.5-jammy
    restart: always
    ports:
      - 3308:3306
    environment:
      MARIADB_ROOT_USER: root
      MARIADB_ROOT_PASSWORD: root

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 8181:8080

